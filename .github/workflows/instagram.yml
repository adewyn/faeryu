name: refresh instagram grid
on:
  schedule:
    - cron: "17 15 * * *"   # once a day
  workflow_dispatch:         # or run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch latest posts
        env:
          BEHOLD_FEED: ${{ vars.BEHOLD_FEED }}
        run: python3 tools/instagram.py
      - name: rebuild pages
        env:
          FAERYU_SITE: ${{ vars.FAERYU_SITE || 'https://adewyn.github.io/faeryu' }}
        run: python3 build.py
      - name: save if anything changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no new posts"; exit 0; fi
          git -c user.name="faeryu bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "refresh instagram grid"
          git push
